<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = "system";
        try { theme = localStorage.getItem("triagesync_theme") || "system"; } catch { /* Storage is optional. */ }
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TriageSync brings support tickets, shared resources, and bookings into one organized workspace."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TriageSync — Support operations" />
    <meta property="og:description" content="Triage support requests, coordinate shared resources, and keep every decision visible in one workspace." />
    <meta name="theme-color" content="#f5f7f6" />
    <title>TriageSync — Support operations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
